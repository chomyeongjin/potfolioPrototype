    <script>
        // Menu toggle
        document.querySelector('.menu-toggle').addEventListener('click', function () {
            document.body.classList.toggle('menu-open');
            document.querySelector('.nav-links').classList.toggle('active');
            this.classList.toggle('open');
        });

        // Carousel logic
        const trackContainer = document.querySelector('.carousel-track-container');
        const track = document.querySelector('.carousel-track');
        const originalSlidesCount = track.children.length;
        const slides = Array.from(track.children);

        // Clone first and last slides for infinite looping
        const firstClone = slides[0].cloneNode(true);
        const lastClone = slides[slides.length - 1].cloneNode(true);

        track.appendChild(firstClone);
        track.insertBefore(lastClone, slides[0]);

        // Setup Carousel Dots
        const indicatorsContainer = document.querySelector('.carousel-indicators');
        const dots = [];
        for (let i = 0; i < originalSlidesCount; i++) {
            const dot = document.createElement('div');
            dot.classList.add('carousel-dot');
            if (i === 0) dot.classList.add('active');

            dot.addEventListener('click', () => {
                const slideWidth = trackContainer.offsetWidth;
                trackContainer.scrollTo({
                    left: slideWidth * (i + 1),
                    behavior: 'smooth'
                });
            });

            if (indicatorsContainer) {
                indicatorsContainer.appendChild(dot);
            }
            dots.push(dot);
        }

        const updateDots = () => {
            const slideWidth = trackContainer.offsetWidth;
            if (slideWidth === 0) return;

            let exactIndex = Math.round((trackContainer.scrollLeft / slideWidth) - 1);
            let mappedIndex = exactIndex % originalSlidesCount;
            if (mappedIndex < 0) mappedIndex += originalSlidesCount;
            if (Object.is(mappedIndex, -0)) mappedIndex = 0;

            dots.forEach((dot, index) => {
                if (index === mappedIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        };

        // Setup initial position to hide the clones from initial view
        const setInitialPosition = () => {
            trackContainer.style.scrollSnapType = 'none';
            trackContainer.scrollLeft = trackContainer.offsetWidth;
            setTimeout(() => {
                trackContainer.style.scrollSnapType = 'x mandatory';
            }, 10);
            updateDots();
        };

        // Call immediately and also on window load to ensure accurate width
        setInitialPosition();
        window.addEventListener('load', setInitialPosition);

        trackContainer.addEventListener('scroll', () => {
            updateDots();

            const maxScrollLeft = trackContainer.scrollWidth - trackContainer.offsetWidth;

            // Reached the clone of the last slide (at the beginning)
            if (trackContainer.scrollLeft <= 0) {
                trackContainer.style.scrollSnapType = 'none';
                trackContainer.scrollLeft = trackContainer.offsetWidth * originalSlidesCount;
                setTimeout(() => {
                    trackContainer.style.scrollSnapType = 'x mandatory';
                }, 0);
            }
            // Reached the clone of the first slide (at the end)
            else if (trackContainer.scrollLeft >= maxScrollLeft - 1) {
                trackContainer.style.scrollSnapType = 'none';
                trackContainer.scrollLeft = trackContainer.offsetWidth;
                setTimeout(() => {
                    trackContainer.style.scrollSnapType = 'x mandatory';
                }, 0);
            }
        });

        window.addEventListener('resize', updateCustomScrollbar);


    </script>
